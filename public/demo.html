<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Painel de Reativação</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --plum:#4c1e63;--brand:#7e22ce;--brand-800:#6b21a8;--brand-50:#faf5ff;--brand-100:#f3e8ff;--brand-300:#d8b4fe;--brand-900:#581c87;
  --lilac:#ce98f2;--lav-50:#fbf9fd;--lav-100:#f5f1f8;--lav-200:#ebe4f0;--lav-300:#ddd2e5;
  --champagne:#c2a36b;--ink:#2a1538;--graphite:#4a4550;--muted:#7a7380;--cloud:#fbfafc;--mist:#d9cfe3;
  --wa:#1fa855;--wa-bg:#efe7de;
  --ok:#15803d;--ok-soft:#dcfce7;--warn:#a16207;--warn-soft:#fef3c7;--err:#b91c1c;--err-soft:#fee2e2;
  --serif:'Fraunces',Georgia,'Times New Roman',serif;
  --sans:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--cloud);color:var(--ink);font-family:var(--sans);font-size:15px;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--brand)}
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
/* sidebar */
.side{background:var(--plum);color:#fff;padding:36px 18px 22px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:0 10px 30px}
.brand b{font-family:var(--serif);font-weight:500;font-size:24px;display:block;letter-spacing:-.01em}
.brand small{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--lilac);font-weight:600}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;color:#eadff2;font-weight:500}
.nav button:hover{background:rgba(255,255,255,.07)}
.nav button.on{background:rgba(255,255,255,.13);color:#fff}
.nav svg{width:18px;height:18px;flex:none}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:14px}
.conn{background:rgba(255,255,255,.08);border-radius:12px;padding:12px 14px;font-size:12.5px;color:#eadff2}
.conn b{display:flex;align-items:center;gap:8px;color:#fff;font-weight:600;margin-bottom:3px}
.dot{width:8px;height:8px;border-radius:50%;background:#4ade80;display:inline-block}
.user{display:flex;align-items:center;gap:10px;padding:0 6px;font-size:13.5px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--lilac);color:var(--plum);display:grid;place-items:center;font-weight:700;font-size:12px}
.user small{display:block;color:#cdb9dc;font-size:12px}
/* main */
.main{padding:28px 48px 64px;min-width:0}
.demo-bar{display:flex;justify-content:flex-end;align-items:center;gap:10px;margin-bottom:18px}
.demo-tag{font-size:12px;font-weight:600;color:var(--brand-900);background:var(--brand-100);border-radius:99px;padding:6px 12px}
.linkbtn{all:unset;cursor:pointer;font-size:12.5px;color:var(--muted);font-weight:600;display:inline-flex;gap:6px;align-items:center}
.linkbtn:hover{color:var(--brand)}
.linkbtn svg{width:14px;height:14px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:26px;flex-wrap:wrap}
.eyebrow{font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 8px}
h1{font-family:var(--serif);font-weight:500;font-size:38px;line-height:1.1;margin:0;letter-spacing:-.015em}
h2{font-family:var(--serif);font-weight:500;font-size:23px;margin:0 0 14px;letter-spacing:-.01em}
h3{font-size:15px;margin:0 0 6px;font-weight:700}
p{line-height:1.55;margin:0}
.lead{color:var(--graphite);max-width:720px;margin-top:10px}
.muted{color:var(--muted)}
.small{font-size:13px}
.card{background:#fff;border:1px solid var(--lav-200);border-radius:18px;padding:24px}
.card.soft{background:var(--lav-100);border-color:transparent}
.grid{display:grid;gap:20px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.g-main{grid-template-columns:minmax(0,1fr) 340px}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.mt8{margin-top:8px}.mt16{margin-top:16px}.mt24{margin-top:24px}.mt32{margin-top:32px}
/* buttons */
.btn{border:0;border-radius:99px;padding:12px 22px;font-weight:600;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;transition:background .15s}
.btn svg{width:17px;height:17px}
.btn-primary{background:var(--brand);color:#fff}.btn-primary:hover{background:var(--brand-800)}
.btn-dark{background:var(--ink);color:#fff}.btn-dark:hover{background:#3d2050}
.btn-ghost{background:#fff;border:1px solid var(--mist);color:var(--ink)}.btn-ghost:hover{border-color:var(--brand-300)}
.btn-text{background:none;color:var(--graphite);padding:12px 4px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn-sm{padding:8px 14px;font-size:13px}
.sim{border:1.5px dashed var(--champagne);background:#fffcf5;border-radius:14px;padding:14px 16px}
.sim-title{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#8a6a2f;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.btn-sim{background:#fff;border:1px solid #e3d2ac;color:#6b5124;border-radius:99px;padding:8px 14px;font-weight:600;font-size:13px}
.btn-sim:hover{background:#fbf3e2}
.btn-sim[disabled]{opacity:.45;cursor:not-allowed}
/* badges */
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border-radius:99px;padding:4px 10px;white-space:nowrap}
.b-ok{background:var(--ok-soft);color:var(--ok)}.b-warn{background:var(--warn-soft);color:var(--warn)}.b-err{background:var(--err-soft);color:var(--err)}
.b-brand{background:var(--brand-100);color:var(--brand-900)}.b-gray{background:var(--lav-100);color:var(--graphite)}
.b-dot::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
/* metrics */
.metric .lbl{font-size:13px;color:var(--graphite)}
.metric .val{font-family:var(--serif);font-size:34px;line-height:1.15;margin-top:4px}
.metric .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.metric.hl .val{color:var(--brand)}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.metrics .metric{padding:2px 18px;border-left:1px solid var(--lav-200)}
.metrics .metric:first-child{border-left:0;padding-left:0}
.bar{height:8px;background:var(--lav-200);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);border-radius:99px}
.split{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--lav-200)}
.split i{display:block;height:100%}
/* table */
.table{width:100%;border-collapse:collapse;font-size:14px}
.table th{text-align:left;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:12px 16px;border-bottom:1px solid var(--lav-200);background:var(--lav-50)}
.table td{padding:12px 16px;border-bottom:1px solid var(--lav-100)}
.table tr:last-child td{border-bottom:0}
.tablewrap{background:#fff;border:1px solid var(--lav-200);border-radius:16px;overflow:hidden}
.tablewrap .scroll{overflow-x:auto}
.clickrow{cursor:pointer}.clickrow:hover td{background:var(--lav-50)}
/* forms */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--graphite)}
.input,.select{border:1px solid var(--mist);border-radius:10px;padding:10px 12px;background:#fff;min-width:0}
.input:focus,.select:focus{outline:2px solid var(--brand-300);border-color:var(--brand)}
.search{position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.search .input{padding-left:36px;width:260px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--mist);background:#fff;border-radius:99px;padding:7px 13px;font-size:13px;font-weight:600;color:var(--graphite)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.check{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--brand);margin-top:2px;flex:none}
/* steps */
.steps{display:flex;align-items:center;gap:14px;margin-bottom:30px}
.step{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted);white-space:nowrap}
.step .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--lav-200);color:var(--graphite)}
.step.on{color:var(--ink);font-weight:600}.step.on .n{background:var(--brand);color:#fff}
.step.done{color:var(--ink)}.step.done .n{background:var(--brand-100);color:var(--brand)}
.step .n svg{width:14px;height:14px}
.conn-line{flex:1;height:2px;background:var(--lav-200);min-width:20px}
.conn-line.done{background:var(--brand)}
/* options */
.opt{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:16px;align-items:flex-start;background:#fff;border:1.5px solid var(--lav-200);border-radius:16px;padding:18px 20px;width:100%}
.opt:hover{border-color:var(--brand-300)}
.opt.on{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-100)}
.opt.dis{opacity:.55;cursor:not-allowed}
.radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--mist);flex:none;margin-top:2px;display:grid;place-items:center}
.opt.on .radio{border-color:var(--brand)}
.opt.on .radio::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--brand)}
.opt .grow{flex:1;min-width:0}
.big-opt{padding:26px}
.big-opt h3{font-family:var(--serif);font-weight:500;font-size:22px;margin-bottom:8px}
.big-opt ul{margin:12px 0 0;padding-left:18px;color:var(--graphite);font-size:14px;line-height:1.7}
/* callouts */
.note{display:flex;gap:12px;background:var(--lav-100);border-radius:14px;padding:14px 16px;font-size:13.5px;color:var(--graphite);line-height:1.55}
.note svg{width:18px;height:18px;color:var(--brand);flex:none;margin-top:1px}
.note.warn{background:var(--warn-soft);color:#713f12}.note.warn svg{color:var(--warn)}
.note.err{background:var(--err-soft);color:#7f1d1d}.note.err svg{color:var(--err)}
.note.ok{background:var(--ok-soft);color:#14532d}.note.ok svg{color:var(--ok)}
/* phone */
.phone{width:320px;border-radius:40px;background:var(--ink);padding:10px;margin:0 auto}
.screen{border-radius:32px;overflow:hidden;background:var(--wa-bg);height:600px;display:flex;flex-direction:column}
.wa-top{background:var(--plum);color:#fff;padding:18px 16px 12px;display:flex;align-items:center;gap:10px}
.wa-top .avatar{width:34px;height:34px}
.wa-top b{font-size:14px;display:block}.wa-top small{font-size:11.5px;color:#e2d3ee}
.wa-body{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:8px}
.wa-body>:first-child{margin-top:auto}
.nowrap{white-space:nowrap}
.table th{white-space:nowrap}
.bub{background:#fff;border-radius:10px;padding:9px 11px;font-size:13.2px;line-height:1.45;max-width:88%;white-space:pre-line;box-shadow:0 1px 0 rgba(0,0,0,.06)}
.bub.me{align-self:flex-end;background:#dcf8c6}
.bub .t{display:block;text-align:right;font-size:10.5px;color:var(--muted);margin-top:4px}
.bub .hint{display:block;font-size:11.5px;color:var(--muted);margin-top:6px}
.wa-btn{background:#fff;border:0;border-radius:10px;padding:10px;font-size:13.5px;font-weight:600;color:#0b7bd8;display:flex;gap:8px;justify-content:center;align-items:center;max-width:88%;width:88%}
.wa-btn svg{width:15px;height:15px}
.wa-btn[disabled]{color:var(--muted);cursor:default}
.wa-input{display:flex;gap:8px;padding:10px;background:#f0f0f0;align-items:center}
.wa-input div{flex:1;background:#fff;border-radius:20px;padding:9px 12px;font-size:13px;line-height:1.35}
.wa-send{width:38px;height:38px;border-radius:50%;background:var(--wa);border:0;color:#fff;display:grid;place-items:center;flex:none}
.wa-send svg{width:17px;height:17px}
.web{background:#fff;flex:1;overflow-y:auto;padding:18px 18px;display:flex;flex-direction:column;gap:10px;scrollbar-width:thin}
.web .input{padding:8px 10px}
.web .logo{font-family:var(--serif);font-size:22px;color:var(--plum);font-weight:500}
.web h4{font-family:var(--serif);font-weight:500;font-size:20px;margin:0;line-height:1.25}
.web .check{background:var(--lav-50);border:1px solid var(--lav-200);border-radius:12px;padding:12px;font-size:13px;line-height:1.45}
.web .check b{display:block;margin-bottom:2px}
.urlbar{background:#f1f1f1;padding:30px 14px 10px;font-size:11.5px;color:#555;text-align:center}
/* misc */
.dropzone{border:2px dashed var(--mist);border-radius:18px;background:#fff;padding:44px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.dropzone .ico{width:54px;height:54px;border-radius:50%;background:var(--brand-100);color:var(--brand);display:grid;place-items:center}
.dropzone .ico svg{width:24px;height:24px}
.spinner{width:22px;height:22px;border:3px solid var(--brand-100);border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;z-index:50;display:flex;gap:10px;align-items:center;box-shadow:0 10px 30px rgba(42,21,56,.25)}
.toast svg{width:16px;height:16px;color:#86efac}
.overlay{position:fixed;inset:0;background:rgba(42,21,56,.45);display:grid;place-items:center;z-index:40;padding:16px}
.modal{background:#fff;border-radius:20px;width:560px;max-width:100%;max-height:90vh;overflow-y:auto;padding:28px}
.kv{display:grid;grid-template-columns:200px 1fr;gap:12px 20px;font-size:14px}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:600}
.hist{font-size:13px;border-left:2px solid var(--lav-200);padding-left:14px;display:flex;flex-direction:column;gap:10px}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.pill-num{font-family:var(--serif);font-size:56px;line-height:1;color:var(--brand)}
.reason{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--lav-200);font-size:14px}
.reason:last-child{border-bottom:0}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--graphite);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.pager{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;font-size:13px;color:var(--muted);border-top:1px solid var(--lav-100)}
.ico-inline{width:16px;height:16px;vertical-align:-3px}
@media (max-width:1100px){.g-main,.g2{grid-template-columns:1fr}.g4{grid-template-columns:1fr 1fr}}
@media (max-width:820px){
  .app{grid-template-columns:1fr}.side{position:static;height:auto;padding:18px 16px}
  .nav{flex-direction:row;overflow-x:auto}.side-foot{display:none}.brand{padding-bottom:14px}
  .main{padding:18px 16px 48px}.g3,.g4{grid-template-columns:1fr}.steps{overflow-x:auto}
  .search .input{width:100%}h1{font-size:30px}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ---------- base data ---------- */
const DAILY = 250;
const PRICE = { UTILITY: 0.0068, MARKETING: 0.0625 };
const CAT = { UTILITY: 'Utilidade', MARKETING: 'Marketing' };
const PURP = {
  A: { label: 'Acompanhamento', col: 'Assistencial', full: 'Acompanhamento (assistencial)', optout: 'acompanhamento', auth: 'Autorização assistencial' },
  M: { label: 'Promoção', col: 'Marketing', full: 'Promoção (marketing)', optout: 'novidades e campanhas', auth: 'Autorização de marketing' }
};
const ST = { GRANTED: 'Sim', DENIED: 'Não', UNKNOWN: 'Desconhecido' };
const LINK_ID = 7;
const ORIGINS = ['Cadastro presencial', 'Formulário digital confirmado pelo WhatsApp', 'Confirmação registrada'];
const TEMPLATES = [
  { id: 't1', purpose: 'A', name: 'Retorno de manutenção', desc: 'Lembra que está na hora da consulta de manutenção.', status: 'APPROVED', suggested: 'UTILITY', cat: 'UTILITY',
    body: 'Olá, {nome}! Aqui é a Oral Clinic, da Dra. Marcela Karin.\n\nPelo seu acompanhamento, já está na hora da sua consulta de manutenção. Manter as revisões em dia ajuda a prevenir problemas e a cuidar da saúde da sua boca.\n\nToque abaixo para falar com a nossa equipe.' },
  { id: 't2', purpose: 'A', name: 'Revisão semestral', desc: 'Convida para a revisão periódica de seis meses.', status: 'APPROVED', suggested: 'UTILITY', cat: 'MARKETING', reclass: true,
    body: 'Olá, {nome}! Já faz cerca de seis meses desde a sua última consulta na Oral Clinic.\n\nA revisão periódica é a forma mais simples de cuidar do seu sorriso e evitar tratamentos maiores. Vamos agendar?' },
  { id: 't3', purpose: 'M', name: 'Convite para avaliação', desc: 'Convida para uma avaliação, sem citar preço.', status: 'APPROVED', suggested: 'MARKETING', cat: 'MARKETING',
    body: 'Olá, {nome}! Aqui é a Oral Clinic, da Dra. Marcela Karin.\n\nFaz um tempo desde o seu último atendimento e queremos saber como está o seu sorriso. Que tal agendar uma avaliação?' },
  { id: 't4', purpose: 'M', name: 'Clareamento dental', desc: 'Enviado para análise da Meta em 27/10/2026.', status: 'PENDING', suggested: 'MARKETING', cat: 'MARKETING',
    body: 'Olá, {nome}! Na Oral Clinic o clareamento dental é feito com acompanhamento profissional, do planejamento ao resultado. Quer saber se é indicado para você?' }
];
const FIRST = ['Ana','Maria','João','Pedro','Carlos','Juliana','Lucas','Patrícia','Rafael','Camila','Bruno','Larissa','Gabriel','Aline','Marcos','Beatriz','Thiago','Renata','Diego','Vanessa','Felipe','Tatiane','Rodrigo','Luana','André','Priscila','Gustavo','Daniela','Leonardo','Jéssica','Ricardo','Mariana','Eduardo','Carla','Vinícius','Sandra','Paulo','Cristina','Matheus','Adriana','Henrique','Simone','Caio','Elaine','Igor','Natália','Fábio','Raquel','Alexandre','Joana','Roberto','Lívia','Márcio','Bianca','Sérgio','Isabela'];
const LAST = ['Santos','Oliveira','Souza','Lima','Pereira','Costa','Ferreira','Almeida','Nascimento','Carvalho','Ribeiro','Barbosa','Rocha','Dias','Teixeira','Moreira','Cardoso','Araújo','Mendes','Freitas','Barreto','Andrade','Bonfim','Matos','Silveira','Conceição','Brito','Cerqueira','Sena','Pinheiro'];

/* ---------- helpers ---------- */
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(a,r){for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const pad = n => String(n).padStart(2,'0');
const fmt = n => n.toLocaleString('pt-BR');
const usd = (v, dec = 2) => 'US$ ' + v.toFixed(dec).replace('.', ',');
const plural = (n, one, many) => fmt(n) + ' ' + (n === 1 ? one : many);
const pct = (a,b) => b ? (Math.round(a/b*1000)/10).toString().replace('.', ',') + '%' : '0%';
const WD = ['dom','seg','ter','qua','qui','sex','sáb'];
const START = new Date(2026, 9, 29);
function bday(i){const d=new Date(START);let k=0;while(k<i){d.setDate(d.getDate()+1);if(d.getDay()!==0)k++}return d}
const dlabel = i => {const d=bday(i);return pad(d.getDate())+'/'+pad(d.getMonth()+1)+' ('+WD[d.getDay()]+')'};
const dshort = i => {const d=bday(i);return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear()};
const first = name => name.split(' ')[0];

const I = {

/* ---------- state ---------- */
let S, timers = [];
function initState(){
  timers.forEach(clearInterval); timers = [];
  S = { route:'inicio', imported:false, importing:false, importResult:null, patients:[], events:[], campaigns:[], collected:false,
    day:0, usedToday:0, templates:JSON.parse(JSON.stringify(TEMPLATES)), tplEvents:[],
    pf:{q:'',purpose:'A',status:'all',page:0}, draft:null, link:{step:'form',a:false,m:false}, linkLog:[],
    modal:null, chat:null, pub:{tab:'in',q:''}, toast:null };
}
const pat = id => S.patients[id];
const tpl = id => S.templates.find(t => t.id === id);

function genPatients(){
  const r = rng(42), ps = [];
  for (let i = 0; i < 780; i++){
    const l1 = LAST[Math.floor(r()*LAST.length)], l2 = LAST[Math.floor(r()*LAST.length)];
    const name = FIRST[Math.floor(r()*FIRST.length)] + ' ' + (r() < .45 && l1 !== l2 ? l1 + ' ' : '') + l2;
    const invalid = i % 29 === 13;
    const d4 = String(1000 + Math.floor(r()*9000));
    const phone = invalid ? (r() < .5 ? 'Sem celular' : '(71) 3' + Math.floor(r()*9) + '••-' + d4) : '(71) 9' + (8 + Math.floor(r()*2)) + '•••-' + d4;
    const last = new Date(2023, 1, 1 + Math.floor(r()*1180));
    ps.push({ id:i, name, phone, valid:!invalid, last: pad(last.getDate())+'/'+pad(last.getMonth()+1)+'/'+last.getFullYear(),
      cons:{ A:{s:'UNKNOWN',o:'Sem registro',d:null}, M:{s:'UNKNOWN',o:'Sem registro',d:null} }, lc:{A:null,M:null} });
  }
  ps[LINK_ID].name = 'Fernanda Rocha Lima'; ps[LINK_ID].phone = '(71) 98•••-4821';
  return ps;
}
function setConsent(p, k, s, origem, actor, when){
  const prev = p.cons[k].s;
  p.cons[k] = { s, o:origem, d: when || dshort(S.day) };
  S.events.push({ pid:p.id, k, from:prev, to:s, origem, actor, when: when || dshort(S.day) });
}
function counts(k){ const c = {GRANTED:0,DENIED:0,UNKNOWN:0}; S.patients.forEach(p => c[p.cons[k].s]++); return c; }

function simulateWeeks(){
  const r = rng(7);
  const pool = shuffle(S.patients.filter(p => p.id !== LINK_ID && p.cons.A.s === 'UNKNOWN' && p.cons.M.s === 'UNKNOWN'), r);
  const when = () => dshort(0).replace(/^\d\d\/10/, pad(1 + Math.floor(r()*28)) + '/10');
  const org = () => { const x = r(); return x < .55 ? ORIGINS[0] : x < .85 ? ORIGINS[1] : ORIGINS[2]; };
  let idx = 0;
  const needAN = Math.max(0, 6 - counts('A').DENIED);
  pool.slice(idx, idx + needAN).forEach(p => { const o = org(), w = when(); setConsent(p,'A','DENIED',o,'Recepção',w); setConsent(p,'M','DENIED',o,'Recepção',w); });
  idx += needAN;
  const needAS = Math.max(0, 312 - counts('A').GRANTED);
  const needMS = Math.max(0, 186 - counts('M').GRANTED);
  const needMN = Math.max(0, 41 - counts('M').DENIED);
  pool.slice(idx, idx + needAS).forEach((p, j) => {
    const o = org(), w = when();
    setConsent(p,'A','GRANTED',o,'Recepção',w);
    if (j < needMS) setConsent(p,'M','GRANTED',o,'Recepção',w);
    else if (j < needMS + needMN) setConsent(p,'M','DENIED',o,'Recepção',w);
  });
  S.collected = true;
}

/* ---------- eligibility ---------- */
function reasonFor(p, purpose, t){
  if (!p.valid) return 'Celular inválido';
  const c = p.cons[purpose].s;
  if (c === 'DENIED') return 'Recusou esta finalidade';
  if (c === 'UNKNOWN') return 'Sem autorização para esta finalidade';
  if (purpose === 'A' && t && t.cat === 'MARKETING' && p.cons.M.s !== 'GRANTED') return 'Modelo de marketing, sem autorização de marketing';
  if (p.lc[purpose] != null && S.day - p.lc[purpose] < 26) return 'Contatado nos últimos 30 dias';
  return null;
}
function audience(purpose, t){
  const inn = [], out = [], reasons = {};
  S.patients.forEach(p => { const r = reasonFor(p, purpose, t); if (r){ out.push({p, r}); reasons[r] = (reasons[r]||0) + 1; } else inn.push(p); });
  return { inn, out, reasons };
}
function sendGuard(p, c){
  if (p.cons[c.purpose].s !== 'GRANTED') return 'Recusou durante a campanha';
  if (c.purpose === 'A' && c.cat === 'MARKETING' && p.cons.M.s !== 'GRANTED') return 'Sem autorização de marketing';
  return null;
}

/* ---------- campaigns ---------- */
const activeCampaign = () => S.campaigns.find(c => ['enviando','aguardando','pausada'].includes(c.status));
function stats(c){
  const s = { total:c.recips.length, queued:0, sent:0, delivered:0, read:0, failed:0, skipped:0, agendar:0, sair:0 };
  c.recips.forEach(x => {
    if (x.st === 'queued') s.queued++; else if (x.st === 'skipped') s.skipped++;
    else { s.sent++; if (x.st === 'failed') s.failed++; if (x.st === 'delivered' || x.st === 'read') s.delivered++; if (x.st === 'read') s.read++; }
    if (x.reply === 'agendar') s.agendar++; if (x.reply === 'sair') s.sair++;
  });
  return s;
}
function batchInfo(c){
  const out = [];
  for (let b = 1; b <= c.nb; b++){
    const xs = c.recips.filter(x => x.b === b);
    const q = xs.filter(x => x.st === 'queued').length, sk = xs.filter(x => x.st === 'skipped').length;
    let state;
    if (q === 0) state = sk === xs.length ? 'Retirado' : 'Enviado';
    else if (b === c.cur && c.status === 'enviando') state = 'Enviando';
    else if (c.status === 'pausada') state = 'Pausado';
    else state = 'Agendado';
    out.push({ b, n: xs.length, day: c.startDay + b - 1, state });
  }
  return out;
}
function startCampaign(){
  const d = S.draft, t = tpl(d.tpl);
  const { inn } = audience(d.purpose, t);
  const r = rng(99 + S.campaigns.length);
  const recips = inn.map((p, i) => {
    const x = r(), y = r();
    let final = x < .015 ? 'failed' : x < .35 ? 'delivered' : 'read';
    let plan = final === 'read' ? (y < .12 ? 'agendar' : y < .15 ? 'sair' : null) : null;
    if (p.id === LINK_ID){ final = 'read'; plan = null; }
    return { pid:p.id, b: Math.floor(i / DAILY) + 1, st:'queued', final, plan, reply:null };
  });
  const c = { id:'c' + (S.campaigns.length + 1), name: d.name.trim() || 'Campanha sem nome', purpose:d.purpose, tpl:t.id, cat:t.cat,
    recips, nb: Math.max(1, Math.ceil(recips.length / DAILY)), cur:0, status:'enviando', startDay:S.day, cost:0, pause:null };
  S.campaigns.unshift(c);
  S.draft = null; S.chat = null;
  go('camp:' + c.id);
  runBatch(c, 1);
}
function applyReply(c, x, kind){
  if (x.reply) return;
  x.reply = kind; x.st = 'read'; x.replyDay = S.day;
  if (kind === 'sair') setConsent(pat(x.pid), c.purpose, 'DENIED', 'Descadastro pelo WhatsApp', 'Paciente');
}
function runBatch(c, b){
  c.cur = b; c.status = 'enviando';
  const list = c.recips.filter(x => x.b === b && x.st === 'queued');
  const r = rng(500 + b * 13 + S.campaigns.length);
  let i = 0;
  const order = { sent:0, delivered:1, read:2 };
  const t = setInterval(() => {
    if (c.status !== 'enviando'){ clearInterval(t); render(); return; }
    for (let k = 0; k < 12 && i < list.length; k++, i++){
      const x = list[i]; if (x.st !== 'queued') continue;
      const why = sendGuard(pat(x.pid), c);
      if (why){ x.st = 'skipped'; x.why = why; continue; }
      x.st = 'sent'; pat(x.pid).lc[c.purpose] = S.day; S.usedToday++; c.cost += PRICE[c.cat];
    }
    let pending = i < list.length;
    list.forEach(x => {
      if (x.st === 'queued' || x.st === 'skipped' || x.st === 'failed') return;
      if (x.final === 'failed'){ if (r() < .3){ x.st = 'failed'; x.why = 'Número sem WhatsApp'; } else pending = true; return; }
      if (order[x.st] < order[x.final]){ if (r() < .3) x.st = x.st === 'sent' ? 'delivered' : 'read'; pending = true; return; }
      if (x.plan && !x.reply){ if (r() < .07) applyReply(c, x, x.plan); else pending = true; }
    });
    if (!pending){
      clearInterval(t);
      c.status = b < c.nb ? 'aguardando' : 'concluida';
      if (c.status === 'concluida') toast('Campanha concluída: todos os lotes foram enviados.');
    }
    if (S.route === 'camp:' + c.id || S.route === 'inicio') render();
  }, 160);
  timers.push(t);
}
function nextDay(){
  S.day++; S.usedToday = 0;
  const c = activeCampaign();
  if (c && c.status === 'aguardando'){ runBatch(c, c.cur + 1); toast('Novo dia: lote ' + c.cur + ' começou às 9h.'); }
  else toast('Avançamos para ' + dlabel(S.day) + '.');
  render();
}
function pauseCampaign(c){ c.status = 'pausada'; render(); }
function resumeCampaign(c){
  const left = c.recips.some(x => x.b === c.cur && x.st === 'queued');
  if (left) runBatch(c, c.cur); else c.status = c.cur < c.nb ? 'aguardando' : 'concluida';
  render();
}
function recategorize(c){
  const t = tpl(c.tpl);
  t.cat = 'MARKETING'; t.reclass = true;
  S.tplEvents.push({ tpl:t.id, from:'UTILITY', to:'MARKETING', when:dshort(S.day) });
  c.status = 'pausada'; c.pause = { from:'UTILITY', to:'MARKETING' };
  toast('Aviso da Meta recebido: o envio foi pausado.');
  render();
}
function approveRecat(c){
  c.cat = 'MARKETING';
  c.recips.forEach(x => { if (x.st === 'queued' && pat(x.pid).cons.M.s !== 'GRANTED'){ x.st = 'skipped'; x.why = 'Sem autorização de marketing após reclassificação'; } });
  c.pause = null;
  resumeCampaign(c);
}
function cancelRest(c){
  c.recips.forEach(x => { if (x.st === 'queued'){ x.st = 'skipped'; x.why = 'Envio cancelado pela clínica'; } });
  c.pause = null; c.status = 'concluida'; render();
}

function vModal(){

function stepsBar(n){
  const L = ['Finalidade','Mensagem','Público','Revisar e enviar'];
  return `<div class="steps">${L.map((l,i) => { const k = i+1, cls = k < n ? 'done' : k === n ? 'on' : '';
    return `${i?`<span class="conn-line ${k<=n?'done':''}"></span>`:''}<span class="step ${cls}"><span class="n">${k<n?ic('check'):k}</span>${l}</span>`; }).join('')}</div>`;
}
function vNova(){

              ${t.reclass && d.purpose==='A' ? `<span class="small" style="display:block;margin-top:8px;color:var(--warn)">A Meta classificou como Marketing. Só recebe quem autorizou acompanhamento e também promoções.</span>` : ''}
            </span></button>`; }).join('')}</div>
          <div class="note mt16">${ic('info')}<span>Os modelos são escritos pela Vexaris seguindo o Código de Ética Odontológica: sem preço, percentual de desconto, gratuidade ou parcelamento. Para um modelo novo, fale com o suporte; ele aparece aqui depois de aprovado pela Meta.</span></div>

function recatBanner(c){

  const q = c.recips.filter(x => x.st === 'queued');
  const lose = q.filter(x => pat(x.pid).cons.M.s !== 'GRANTED').length;
  const keep = q.length - lose;
  return `<div class="note err" style="margin-bottom:20px">${ic('alert')}<div>
    <b>A Meta reclassificou o modelo "${t.name}" de Utilidade para Marketing.</b> O envio foi pausado automaticamente.<br>
    Faltam ${fmt(q.length)} pacientes. ${fmt(lose)} não autorizaram promoções e serão retirados. Os outros ${fmt(keep)} seguem com custo de Marketing: novo custo estimado do restante ${usd(keep * PRICE.MARKETING)}.
    <div class="row mt16" style="flex-wrap:wrap"><button class="btn btn-dark btn-sm" data-act="approveRecat" data-c="${c.id}">Aprovar e retomar com ${fmt(keep)}</button><button class="btn btn-ghost btn-sm" data-act="cancelRest" data-c="${c.id}">Encerrar a campanha</button></div></div></div>`;

function vCamp(id){
  const c = S.campaigns.find(x => x.id === id);
  if (!c) return vCampanhas();
  const t = tpl(c.tpl), s = stats(c), bi = batchInfo(c);
  const sentList = c.recips.filter(x => !['queued','skipped','failed'].includes(x.st));
  if (!S.chat || S.chat.cid !== c.id || !c.recips.find(x => x.pid === S.chat.pid && x.st !== 'queued' && x.st !== 'skipped')){
    const pick = sentList.find(x => !x.reply && !x.plan) || sentList[0];
    S.chat = pick ? { cid:c.id, pid:pick.pid } : null;
  }
  const cx = S.chat && c.recips.find(x => x.pid === S.chat.pid);
  let extra = '';
  if (cx && cx.reply){
    const p = pat(cx.pid);
    extra = `<div class="bub me">${cx.reply === 'agendar' ? 'Quero agendar' : 'Não quero receber'}<span class="t">09:14</span></div>` +
      (cx.reply === 'agendar' ? `<div class="bub">Que bom, ${first(p.name)}! Para escolher o melhor dia e horário, fale com a nossa recepção no WhatsApp principal da clínica:\nwa.me/55719xxxxxxxx<span class="t">09:14</span></div>`
        : `<div class="bub">Tudo certo, ${first(p.name)}. Você não vai mais receber mensagens de ${PURP[c.purpose].optout} da Oral Clinic por este número. Se mudar de ideia, é só avisar na recepção.<span class="t">09:14</span></div>`);
  }
  const agList = c.recips.filter(x => x.reply === 'agendar').slice().reverse();
  const outList = c.recips.filter(x => x.reply === 'sair' || x.st === 'failed' || x.st === 'skipped');
  const canRecat = t.cat === 'UTILITY' && ['enviando','aguardando'].includes(c.status) && c.recips.some(x => x.st === 'queued');
  return `${c.pause ? recatBanner(c) : ''}` + head(PURP[c.purpose].full, c.name,
      `<div class="row">${c.status==='enviando'?`<button class="btn btn-ghost" data-act="pause" data-c="${c.id}">${ic('pause')}Pausar</button>`:''}${c.status==='pausada'&&!c.pause?`<button class="btn btn-primary" data-act="resume" data-c="${c.id}">${ic('play')}Retomar</button>`:''}</div>`) + `
    <div class="row" style="margin-top:-12px;margin-bottom:24px;flex-wrap:wrap">${campBadge(c)}<span class="badge b-gray">${t.name}</span>${catBadge(c.cat)}<span class="muted small">Custo até agora: ${usd(c.cost)}</span></div>
    <div class="grid g-main">
      <div class="stack" style="gap:20px">
        <div class="card">
          <div class="row between small"><b>${fmt(s.sent)} de ${fmt(s.total)} mensagens enviadas</b><span class="muted">${s.skipped ? fmt(s.skipped) + ' retirados' : ''}</span></div>
          <div class="bar mt8"><i style="width:${s.total ? s.sent/s.total*100 : 0}%"></i></div>
          <div class="metrics mt24">
            <div class="metric"><div class="lbl">Entregues</div><div class="val">${fmt(s.delivered)}</div><div class="sub">${pct(s.delivered, s.sent)} das enviadas</div></div>
            <div class="metric"><div class="lbl">Lidas</div><div class="val">${fmt(s.read)}</div><div class="sub">${pct(s.read, s.delivered)} das entregues</div></div>
            <div class="metric hl"><div class="lbl">Quero agendar</div><div class="val">${fmt(s.agendar)}</div><div class="sub">foram para o WhatsApp da clínica</div></div>
            <div class="metric"><div class="lbl">Descadastros</div><div class="val">${fmt(s.sair)}</div><div class="sub">só desta finalidade</div></div>
            <div class="metric"><div class="lbl">Falhas</div><div class="val">${fmt(s.failed)}</div><div class="sub">sem WhatsApp</div></div>
          </div>
        </div>
        <div class="card"><h2>Lotes</h2><div class="tablewrap"><table class="table"><thead><tr><th>Lote</th><th>Data</th><th>Pacientes</th><th>Situação</th></tr></thead><tbody>
          ${bi.map(x => `<tr><td>Lote ${x.b}</td><td>${dlabel(x.day)}</td><td>${fmt(x.n)}</td><td>${x.state==='Enviado'?'<span class="badge b-ok">Enviado</span>':x.state==='Enviando'?'<span class="badge b-brand b-dot">Enviando</span>':x.state==='Pausado'?'<span class="badge b-warn">Pausado</span>':x.state==='Retirado'?'<span class="badge b-gray">Retirado</span>':'<span class="badge b-gray">Agendado, 9h</span>'}</td></tr>`).join('')}
        </tbody></table></div></div>
        <div class="card"><div class="row between"><h2 style="margin:0">Quiseram agendar</h2><button class="btn btn-ghost btn-sm" data-act="export">Exportar lista</button></div>
          <p class="muted small mt8">A recepção recebe essas conversas no WhatsApp principal. Esta lista serve para conferir quem ainda não marcou.</p>
          <div class="tablewrap mt16"><table class="table"><thead><tr><th>Paciente</th><th>Celular</th><th>Último atendimento</th><th>Quando</th></tr></thead><tbody>
          ${agList.slice(0, 8).map(x => { const p = pat(x.pid); return `<tr><td><b>${p.name}</b></td><td>${p.phone}</td><td>${p.last}</td><td>${dlabel(x.replyDay)}</td></tr>`; }).join('') || '<tr><td colspan="4" class="empty">As respostas aparecem aqui conforme os pacientes tocam no botão.</td></tr>'}
          </tbody></table>${agList.length > 8 ? `<div class="pager"><span>Mostrando 8 de ${fmt(agList.length)}</span></div>` : ''}</div></div>
        ${outList.length ? `<div class="card"><h2>Descadastros, falhas e retirados</h2><div class="tablewrap"><table class="table"><thead><tr><th>Paciente</th><th>O que aconteceu</th></tr></thead><tbody>
          ${outList.slice(0, 8).map(x => `<tr><td><b>${pat(x.pid).name}</b></td><td class="small">${x.reply==='sair' ? 'Tocou em "Não quero receber". ' + PURP[c.purpose].auth + ' mudou para Não.' : x.why}</td></tr>`).join('')}
          </tbody></table>${outList.length > 8 ? `<div class="pager"><span>Mostrando 8 de ${fmt(outList.length)}</span></div>` : ''}</div></div>` : ''}
      </div>
      <div class="stack" style="gap:16px">
        <p class="eyebrow" style="text-align:center;margin:0">Como o paciente recebe</p>
        ${cx ? phoneTpl(t, first(pat(cx.pid).name), extra, true, { dis: !!cx.reply }) : `<div class="card empty small">As mensagens aparecem aqui assim que o primeiro lote começar.</div>`}
        ${cx ? `<p class="muted small" style="text-align:center">${pat(cx.pid).name}. Toque nos botões para ver a resposta automática.</p>` : ''}
        <div class="sim"><div class="sim-title">${ic('flask','ico-inline')}Simulação para a apresentação</div>
          <div class="stack" style="gap:8px">
            <button class="btn-sim" data-act="otherChat" ${sentList.length < 2 ? 'disabled' : ''}>Ver outro paciente</button>
            <button class="btn-sim" data-act="nextDay" ${c.status !== 'aguardando' ? 'disabled' : ''}>Avançar para o próximo dia</button>
            <button class="btn-sim" data-act="recat" data-c="${c.id}" ${canRecat ? '' : 'disabled'}>Meta reclassifica o modelo para Marketing</button>
          </div>
          <p class="muted small mt8">${t.cat === 'UTILITY' ? 'A reclassificação só se aplica a modelos de Utilidade.' : 'Este modelo já é de Marketing.'}</p></div>
      </div>
    </div>`;
}

/* link */
function vLink(){
  const L = S.link, p = pat(LINK_ID) || { name:'Fernanda Rocha Lima' };
  let screen;
  if (L.step === 'form'){
    screen = `<div class="urlbar">oral-clinic-salvador.com.br/autorizar</div><div class="web">
      <div class="logo">Oral Clinic</div>
      <h4>Como você prefere falar com a gente?</h4>
      <p class="small muted">Escolha o que você quer receber no WhatsApp. Você pode mudar quando quiser.</p>
      <div class="field"><label>Nome</label><input class="input" value="${p.name}" readonly></div>
      <div class="field"><label>Celular com WhatsApp</label><input class="input" value="(71) 98765-4821" readonly></div>
      <label class="check"><input type="checkbox" data-lk="a" ${L.a?'checked':''}><span><b>Acompanhamento do meu tratamento</b>Lembretes de retorno, revisões e continuidade do cuidado.</span></label>
      <label class="check"><input type="checkbox" data-lk="m" ${L.m?'checked':''}><span><b>Novidades e campanhas da clínica</b>Informações sobre serviços e campanhas.</span></label>
      <button class="btn btn-primary" style="justify-content:center;background:var(--wa)" data-act="lkSubmit">Confirmar pelo WhatsApp</button>
      <p class="small muted">Para sua segurança, a confirmação é feita por uma mensagem enviada do seu próprio WhatsApp.</p></div>`;
  } else {
    const msg = 'Confirmo minhas preferências de contato. Código OC-4821';
    const done = L.step === 'done';
    screen = `<div class="wa-top"><span class="avatar">OC</span><div><b>Oral Clinic</b><small>Conta comercial</small></div></div>
      <div class="wa-body">${done ? `<div class="bub me">${msg}<span class="t">10:02</span></div>
        <div class="bub">Obrigado, ${first(p.name)}! Suas preferências foram registradas:\nAcompanhamento: ${L.a?'sim':'não'}\nNovidades e campanhas: ${L.m?'sim':'não'}\n\nPara mudar, é só responder esta conversa.<span class="t">10:02</span></div>` : '<p class="muted small" style="text-align:center;margin:auto">O WhatsApp abre com a mensagem já escrita. O paciente só toca em enviar.</p>'}</div>
      <div class="wa-input"><div>${done ? '<span class="muted">Mensagem</span>' : msg}</div><button class="wa-send" data-act="lkSend" ${done?'disabled':''}>${ic('send')}</button></div>`;
  }
  return head('Autorizações', 'Link de autorização', '', 'O paciente escolhe o que quer receber e confirma pelo próprio WhatsApp. Isso prova que o celular é dele, e a autorização entra no painel na hora.') + `
    <div class="grid g-main" style="grid-template-columns:minmax(0,1fr) 340px">
      <div class="stack" style="gap:20px">
        <div class="card"><p class="eyebrow">Seu link</p>
          <div class="row" style="flex-wrap:wrap"><input class="input" style="flex:1;min-width:220px" value="oral-clinic-salvador.com.br/autorizar" readonly><button class="btn btn-ghost" data-act="copy">${ic('copy')}Copiar link</button></div>
          <div class="grid g3 mt24 small">
            <div><h3>Na recepção</h3><p class="muted">Em um tablet ou por QR code no balcão, para novos pacientes e para quem voltar.</p></div>
            <div><h3>No WhatsApp principal</h3><p class="muted">Enviado pela recepção durante as conversas do dia a dia.</p></div>
            <div><h3>No Instagram</h3><p class="muted">Na bio e nos destaques do perfil da clínica.</p></div>
          </div></div>
        <div class="card"><h2>Como funciona</h2>
          <div class="stack small">
            <div class="row" style="align-items:flex-start"><span class="badge b-brand">1</span><span>O paciente marca as autorizações que quiser. As duas caixas são separadas.</span></div>
            <div class="row" style="align-items:flex-start"><span class="badge b-brand">2</span><span>Toca em "Confirmar pelo WhatsApp", que abre uma conversa com a mensagem e um código já escritos.</span></div>
            <div class="row" style="align-items:flex-start"><span class="badge b-brand">3</span><span>Quando a mensagem chega, o painel registra Sim ou Não em cada finalidade, com origem e data.</span></div>
          </div></div>
        <div class="card"><h2>Confirmações recebidas</h2>
          ${S.linkLog.length ? `<div class="tablewrap"><table class="table"><thead><tr><th>Paciente</th><th>Assistencial</th><th>Marketing</th><th>Situação</th></tr></thead><tbody>
            ${S.linkLog.slice().reverse().map(l => `<tr><td><b>${l.name}</b><br><span class="small muted">${l.when}</span></td><td>${stBadge(l.a?'GRANTED':'DENIED')}</td><td>${stBadge(l.m?'GRANTED':'DENIED')}</td><td>${l.ok?'<span class="badge b-ok">Confirmado pelo WhatsApp</span>':'<span class="badge b-warn">Aguardando confirmação</span>'}</td></tr>`).join('')}
          </tbody></table></div>` : '<p class="muted small">Faça o teste no celular ao lado para ver a confirmação chegar aqui.</p>'}
          ${L.step === 'done' ? `<div class="row mt16"><button class="btn btn-ghost btn-sm" data-act="lkPatient">Ver ${first(p.name)} em Pacientes</button><button class="linkbtn" data-act="lkReset">${ic('refresh')}Recomeçar o exemplo</button></div>` : ''}
        </div>
      </div>
      <div><p class="eyebrow" style="text-align:center">Celular do paciente</p><div class="phone"><div class="screen">${screen}</div></div></div>
    </div>`;
}

function vConfig(){
  return head('Ajustes', 'Configurações', '', 'Na demonstração, estas configurações são apenas ilustrativas.') + `
    <div class="grid g2">
      <div class="card"><h2>WhatsApp</h2><dl class="kv">
        <dt>Número de campanhas</dt><dd>(71) 9xxxx-xxxx · API oficial</dd>
        <dt>Qualidade</dt><dd><span class="badge b-ok">Alta</span></dd>
        <dt>Limite diário</dt><dd>${DAILY} pessoas, definido pela Meta</dd>
        <dt>"Quero agendar" leva para</dt><dd>WhatsApp principal da clínica</dd></dl></div>
      <div class="card"><h2>Regras de envio</h2><dl class="kv">
        <dt>Horário</dt><dd>9h às 18h</dd><dt>Dias</dt><dd>Segunda a sábado</dd>
        <dt>Intervalo mínimo</dt><dd>30 dias entre campanhas da mesma finalidade</dd>
        <dt>Pausa automática</dt><dd>Se a qualidade cair ou a Meta reclassificar um modelo</dd></dl></div>
      <div class="card"><h2>Acesso</h2><dl class="kv"><dt>Dra. Marcela Karin</dt><dd>Clínica</dd><dt>Suporte Vexaris</dt><dd>Manutenção e modelos de mensagem</dd></dl></div>
      <div class="card"><h2>Modelos de mensagem</h2>
        <div class="stack small">${S.templates.map(t => `<div class="row between"><span>${t.name} <span class="muted">· ${PURP[t.purpose].label}</span></span><span class="row" style="gap:6px">${t.status==='APPROVED'?'<span class="badge b-ok">Aprovado</span>':'<span class="badge b-warn">Em análise</span>'}${catBadge(t.cat)}</span></div>`).join('')}</div>
        <p class="muted small mt16">Sincronizado com a Meta. Mudanças de categoria chegam automaticamente.</p></div>
    </div>`;
}

/* ---------- render ---------- */
function render(){
  const r = S.route;
  const fa = document.activeElement, focusKey = fa && (fa.getAttribute('data-pf') || (fa.hasAttribute('data-pubq') && 'pubq') || (fa.hasAttribute('data-dname') && 'dname'));
  const caret = focusKey ? fa.selectionStart : null;
  let v;
  if (r === 'inicio') v = vInicio(); else if (r === 'importar') v = vImportar(); else if (r === 'pacientes') v = vPacientes();
  else if (r === 'nova') v = vNova(); else if (r === 'campanhas') v = vCampanhas(); else if (r === 'link') v = vLink();
  else if (r === 'config') v = vConfig(); else if (r.startsWith('camp:')) v = vCamp(r.slice(5)); else v = vInicio();
  document.getElementById('app').innerHTML = `<div class="app">${sidebar()}<main class="main">${demoBar()}${v}</main></div>${vModal()}${S.toast ? `<div class="toast">${ic('check')}${S.toast}</div>` : ''}`;
  document.querySelectorAll('.wa-body').forEach(el => { el.scrollTop = el.scrollHeight; });
  if (focusKey){
    const el = document.querySelector(focusKey === 'pubq' ? '[data-pubq]' : focusKey === 'dname' ? '[data-dname]' : `[data-pf="${focusKey}"]`);
    if (el && el.tagName === 'INPUT'){ el.focus(); try { el.setSelectionRange(caret, caret); } catch(e){} }
  }
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-go],[data-act],[data-purpose],[data-tpl],[data-pfs],[data-page],[data-edit],[data-pubtab],[data-wa]');
  if (e.target.closest('[data-stop]') && !(t && t.closest('[data-stop]'))) return;
  if (!t) return;
  const d = t.dataset;
  if (d.go){
    if (d.go === 'nova' && S.route !== 'nova') S.draft = null;
    if (d.go === 'pacientes' && t.closest('.nav')) S.pf.q = '';
    go(d.go); return;
  }
  if (d.purpose){ S.draft.purpose = d.purpose; S.draft.tpl = null; S.draft.name = ''; render(); return; }
  if (d.tpl){ if (!t.disabled){ S.draft.tpl = d.tpl; S.draft.name = ''; render(); } return; }
  if (d.pfs){ S.pf.status = d.pfs; S.pf.page = 0; render(); return; }
  if (d.page){ S.pf.page += +d.page; render(); return; }
  if (d.edit){ const p = pat(+d.edit); S.modal = { pid:p.id, A:p.cons.A.s, M:p.cons.M.s, o:'' }; render(); return; }
  if (d.pubtab){ S.pub.tab = d.pubtab; render(); return; }
  if (d.wa){
    const c = S.campaigns.find(x => x.id === S.chat.cid), x = c.recips.find(y => y.pid === S.chat.pid);
    applyReply(c, x, d.wa);
    toast(d.wa === 'agendar' ? 'Resposta automática enviada com o link do WhatsApp da clínica.' : PURP[c.purpose].auth + ' mudou para Não.');
    return;
  }
  const c = d.c && S.campaigns.find(x => x.id === d.c);
  switch (d.act){
    case 'reset': initState(); render(); break;
    case 'import':
      S.importing = true; render();
      setTimeout(() => { S.patients = genPatients(); S.imported = true; S.importing = false;
        S.importResult = { lines:803, patients:780, dups:23, invalid:S.patients.filter(p => !p.valid).length }; render(); }, 1400);
      break;
    case 'weeks': simulateWeeks(); toast('Autorizações fictícias de 4 semanas registradas.'); break;
    case 'close': S.modal = null; render(); break;
    case 'saveModal': {
      const m = S.modal, p = pat(m.pid);
      ['A','M'].forEach(k => { if (m[k] !== p.cons[k].s) setConsent(p, k, m[k], m.o, 'Dra. Marcela Karin'); });
      S.modal = null; toast('Autorização salva no histórico do paciente.'); break; }
    case 'next': S.draft.step++; S.pub = { tab:'in', q:'' }; window.scrollTo(0,0); render(); break;
    case 'back': S.draft.step--; window.scrollTo(0,0); render(); break;
    case 'cancelDraft': S.draft = null; go('inicio'); break;
    case 'test': toast('Teste enviado para o celular da Dra. Marcela.'); break;
    case 'start': startCampaign(); break;
    case 'pause': pauseCampaign(c); break;
    case 'resume': resumeCampaign(c); break;
    case 'recat': recategorize(c); break;
    case 'approveRecat': approveRecat(c); toast('Aprovado. O envio continua só com quem autorizou promoções.'); break;
    case 'cancelRest': cancelRest(c); toast('Campanha encerrada. Os pacientes restantes não recebem.'); break;
    case 'nextDay': nextDay(); break;
    case 'otherChat': {
      const cc = S.campaigns.find(x => x.id === S.chat.cid);
      const list = cc.recips.filter(x => !['queued','skipped','failed'].includes(x.st));
      const i = list.findIndex(x => x.pid === S.chat.pid);
      const nxt = list.slice(i + 1).concat(list.slice(0, i + 1)).find(x => !x.reply) || list[(i + 1) % list.length];
      S.chat = { cid:cc.id, pid:nxt.pid }; render(); break; }
    case 'export': toast('Lista exportada em Excel.'); break;
    case 'copy': toast('Link copiado.'); break;
    case 'lkSubmit':
      S.link.step = 'wa';
      S.linkLog.push({ name:'Fernanda Rocha Lima', a:S.link.a, m:S.link.m, ok:false, when:dlabel(S.day) + ', 10:01' });
      render(); break;
    case 'lkSend': {
      const p = pat(LINK_ID) || { name:'Fernanda Rocha Lima' }, o = 'Formulário digital confirmado pelo WhatsApp';
      if (S.imported){ setConsent(p, 'A', S.link.a ? 'GRANTED' : 'DENIED', o, 'Paciente'); setConsent(p, 'M', S.link.m ? 'GRANTED' : 'DENIED', o, 'Paciente'); }
      S.linkLog[S.linkLog.length - 1].ok = true; S.link.step = 'done';
      toast(S.imported ? 'Autorizações de ' + first(p.name) + ' registradas no painel.' : 'Confirmação recebida. Importe a planilha para ver o paciente na base.');
      break; }
    case 'lkReset': S.link = { step:'form', a:false, m:false }; render(); break;
    case 'lkPatient': S.pf = { q:'Fernanda', purpose:'A', status:'all', page:0 }; go('pacientes'); break;
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.pf === 'q'){ S.pf.q = t.value; S.pf.page = 0; render(); }
  else if (t.hasAttribute('data-pubq')){ S.pub.q = t.value; render(); }
  else if (t.hasAttribute('data-dname')){ S.draft.name = t.value; const b = document.querySelector('[data-act="start"]'); if (b) b.disabled = !S.draft.ok || !!activeCampaign() || !t.value.trim(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.pf === 'purpose'){ S.pf.purpose = t.value; S.pf.page = 0; render(); }
  else if (t.dataset.mf){ S.modal[t.dataset.mf] = t.value; render(); }
  else if (t.hasAttribute('data-dok')){ S.draft.ok = t.checked; render(); }
  else if (t.dataset.lk){ S.link[t.dataset.lk] = t.checked; render(); }
});
initState(); render();
</script>
</body>
</html>
